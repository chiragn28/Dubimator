# Prometheus scrape config (docker compose --profile monitoring).
# The bearer key file is written at start by the prometheus-init service from API_KEYS in .env;
# it lives only in the prometheus_secrets volume and is never committed.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dubimator-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secrets/api_key
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
