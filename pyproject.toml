[project]
name = "zestimator"
version = "0.1.0"
description = "Dubai Real Estate ML Platform — price estimation, fraud detection, and search ranking on DLD transaction data"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.44.2",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "requests>=2.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]
