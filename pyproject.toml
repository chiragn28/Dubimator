[project]
name = "dubimator"
version = "0.1.0"
description = "Dubai Real Estate ML Platform — price estimation, fraud detection, and search ranking on DLD transaction data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow==2.17.2",
    "optuna>=5.0.0",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "polars>=1.44.2",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=17.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
    "torch==2.9.1",
    "uvicorn>=0.30",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "requests>=2.32",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: needs a CUDA-capable GPU (deselected in CI, which has none)",
    "live: needs the running Docker stack and registered MLflow champions",
    "db: uses the pg_test_db fixture (a live Postgres test database); auto-applied, see tests/conftest.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]
