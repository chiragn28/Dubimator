# The demo's palette, matched to the landing page (landing/src/components/Hero.tsx) so the
# product reads as one thing: emerald accent on a deep ink ground with a teal bias, rather than
# Streamlit's default red on neutral grey.
[theme]
base = "dark"
primaryColor = "#10B981"
backgroundColor = "#0B1014"
# Inputs and popovers take this, so it sits a clear step above the card surface (#121A20).
secondaryBackgroundColor = "#1B2732"
textColor = "#E6EDF3"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
