version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Every registered model was logged with MLflow 2.17.2; MLflow 3 changes the model
      # format and the registry API, so the pin is deliberate (see pyproject.toml).
      - dependency-name: "mlflow"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # torch is pinned to the cu128 wheel the lockfile resolves; bump it by hand.
      - dependency-name: "torch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "weekly"
    groups:
      landing:
        patterns: ["*"]
