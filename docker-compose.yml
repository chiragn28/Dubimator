services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zestimator-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: zestimator-mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: zestimator-airflow:local
    container_name: zestimator-airflow
    command: bash -c "rm -f /opt/airflow/*.pid && exec airflow standalone"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      PYTHONPATH: /opt/zestimator
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB}
      DLD_CSV_PATH: /opt/zestimator/data/raw/Transactions.csv
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/zestimator/ingestion:ro
      - ./data:/opt/zestimator/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; h = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health')); assert h['metadatabase']['status'] == 'healthy' and h['scheduler']['status'] == 'healthy'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # --- Phase 10: serving -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: zestimator-api:local
    container_name: zestimator-api
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"  # the container port on the compose network, not the host port
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_KEYS: ${API_KEYS:-}
      API_ADMIN_KEYS: ${API_ADMIN_KEYS:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_COMPONENTS: ${API_COMPONENTS:-}
      API_EMBED_DEVICE: cpu
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - hf_cache:/home/app/.cache/huggingface
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: zestimator-demo:local
    container_name: zestimator-demo
    depends_on:
      api:
        condition: service_healthy
    environment:
      DEMO_API_URL: http://api:8000
      DEMO_API_KEY: ${DEMO_API_KEY:-}
    ports:
      - "127.0.0.1:${DEMO_PORT:-8501}:8501"
    # `default` reaches the API; `public` is the only network the tunnels share with it.
    networks:
      - default
      - public
    restart: unless-stopped

  # --- Phase 10: monitoring (docker compose --profile monitoring up -d) ----------------------
  prometheus-init:
    image: busybox:1.37.0
    profiles: ["monitoring"]
    environment:
      PROMETHEUS_API_KEY: ${PROMETHEUS_API_KEY:-}
      API_KEYS: ${API_KEYS:-}
    # Writes the scrape key (PROMETHEUS_API_KEY, else the first API_KEYS entry) to a volume-only
    # file Prometheus reads; the key is never printed.
    command:
      - sh
      - -c
      - >-
        key="$$(printf '%s' "$$PROMETHEUS_API_KEY" | tr -d ' \t\r\n')";
        [ -n "$$key" ] || key="$$(printf '%s' "$$API_KEYS" | cut -d, -f1 | tr -d ' \t\r\n')";
        [ -n "$$key" ] || { echo 'set PROMETHEUS_API_KEY or API_KEYS in .env' >&2; exit 1; };
        umask 077; printf '%s' "$$key" > /etc/prometheus-secrets/api_key;
        chown 65534:65534 /etc/prometheus-secrets/api_key
    volumes:
      - prometheus_secrets:/etc/prometheus-secrets

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: zestimator-prometheus
    profiles: ["monitoring"]
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_secrets:/etc/prometheus-secrets:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    container_name: zestimator-grafana
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    # Refuse to start with Grafana's default admin password (a `:?` here would break
    # `docker compose config` for every profile, since compose interpolates the whole file).
    entrypoint:
      - sh
      - -c
      - >-
        [ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] ||
        { echo 'set GRAFANA_ADMIN_PASSWORD in .env' >&2; exit 1; };
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Phase 10: public link (only the demo is ever exposed) ---------------------------------
  # The cloudflared image is distroless (no shell), so the two modes are two services:
  #   docker compose --profile tunnel up -d cloudflared-quick         random *.trycloudflare.com
  #   docker compose --profile tunnel-named up -d cloudflared-named   CLOUDFLARE_TUNNEL_TOKEN
  cloudflared-quick:
    image: cloudflare/cloudflared:2026.9.1
    container_name: zestimator-cloudflared-quick
    profiles: ["tunnel"]
    depends_on:
      - demo
    command: ["tunnel", "--no-autoupdate", "--url", "http://demo:8501"]
    networks:
      - public  # only the demo is reachable from here, never the API or the databases
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:2026.9.1
    container_name: zestimator-cloudflared-named
    profiles: ["tunnel-named"]
    depends_on:
      - demo
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}  # read by cloudflared; never on the command line
    command: ["tunnel", "--no-autoupdate", "run"]
    networks:
      - public  # only the demo is reachable from here, never the API or the databases
    restart: unless-stopped

networks:
  default:
  # Shared only by the demo and the cloudflared services.
  public:

volumes:
  postgres_data:
  airflow_data:
  mlflow_data:
  hf_cache:
  prometheus_secrets:
  prometheus_data:
  grafana_data:
